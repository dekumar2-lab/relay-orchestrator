<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relay Orchestrator - Logs</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-base text-slate-800 font-sans min-h-screen">
<div th:fragment="content" class="p-6">
    <div class="rounded-lg border border-slate-200 bg-panel overflow-hidden">
        <div class="border-b border-slate-200 px-5 py-3">
            <h2 class="text-sm font-semibold text-slate-700">Terminal Logs</h2>
        </div>
        <div class="space-y-3 bg-slate-100 p-5 text-sm text-slate-700">
            <p class="text-slate-600">The live stream is attached once at the shared layout shell to keep one active log panel across the app.</p>
        </div>
    </div>
</div>
</body>
</html>
