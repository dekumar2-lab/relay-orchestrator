                <div class="border-t border-slate-200 mt-auto p-4">

                </div>

                <!-- Log panel pinned to bottom -->
                <div id="log-panel" class="border-t border-slate-200 bg-white flex flex-col shrink-0"
                    style="height: 240px; min-height: 100px; max-height: 70vh;">
                    <div id="log-resize-handle"
                        class="h-1 cursor-ns-resize bg-slate-200 hover:bg-blue-500 transition-colors"
                        title="Drag to resize"></div>
                    <div class="flex items-center justify-between px-4 py-1.5 text-[10px] uppercase tracking-[0.18em] text-slate-500 select-none border-b border-slate-100">
                        <span>Live Slicer Stream</span>

                            <button type="button" id="log-clear-btn"

                        </div>
                    </div>
                    <div id="log-scroll"
                        class="flex-1 overflow-auto bg-white px-4 py-2 font-mono text-xs text-slate-700" hx-ext="sse"

                        <div id="log-content" sse-swap="logline" hx-swap="afterbegin"></div>

    <script>
        // ---- Stage icon animation for any [data-stage-icon] elements (kept for compat) ----
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-stage-icon]').forEach(node => {
                const icons = ['◉', '◌', '◎'];
                let index = 0;
                if (node.dataset.stageState === 'active') {
                    setInterval(() => {
                        index = (index + 1) % icons.length;
                        node.textContent = icons[index];
                    }, 700);
                }
            });
        });
   
        // ---- Log panel: resize + persist height + auto-scroll ----
        document.addEventListener('DOMContentLoaded', function () {
            const panel = document.getElementById('log-panel');
            const handle = document.getElementById('log-resize-handle');
            const logScroll = document.getElementById('log-scroll');

            // Restore persisted height
            if (panel) {
                const saved = localStorage.getItem('relay.logPanelHeight');
                if (saved) {
                    panel.style.height = saved + 'px';
                }
            }

            const clearBtn = document.getElementById('log-clear-btn');
                if (clearBtn) {
                    clearBtn.addEventListener('click', async () => {
                        const content = document.getElementById('log-content');
                        if (content) content.innerHTML = '';
                        try { await fetch('/logs/clear', { method: 'POST' }); } catch (_) {}
                    });
                }

            // Drag to resize
            if (panel && handle) {
                let startY = 0;
                let startHeight = 0;
                let dragging = false;

                handle.addEventListener('mousedown', function (e) {
                    dragging = true;
                    startY = e.clientY;
                    startHeight = panel.offsetHeight;
                    document.body.style.userSelect = 'none';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', function (e) {
                    if (!dragging) return;
                    const delta = startY - e.clientY;
                    let newHeight = startHeight + delta;
                    newHeight = Math.max(100, Math.min(newHeight, window.innerHeight * 0.7));
                    panel.style.height = newHeight + 'px';
                });

                document.addEventListener('mouseup', function () {
                    if (!dragging) return;
                    dragging = false;
                    document.body.style.userSelect = '';
                    if (panel.offsetHeight > 0) {
                        localStorage.setItem('relay.logPanelHeight', panel.offsetHeight);
                    }
                });
            }

            // Auto-scroll to newest log line (only if user is near bottom)
            if (logScroll) {
                const observer = new MutationObserver(() => {
                    // Newest lines render at the top. Only auto-scroll if the user
                    // is already near the top — don't yank them if they're reading
                    // older entries below.
                    if (logScroll.scrollTop < 100) {
                        logScroll.scrollTop = 0;
                    }
                });
                observer.observe(logScroll, { childList: true, subtree: true });

                requestAnimationFrame(() => {
                    logScroll.scrollTop = 0;
                });
            }
        });

        document.addEventListener('alpine:init', () => {
            Alpine.store('session', {
                current: null,
                pending: null,          // 'Analysis' | 'Decision' | 'Compile' while LLM is thinking

                get stages() {
                    if (this.pending) return stagesFor(this.pending);
                    return computeStages(this.current?.stage || 'NEW');
                },

                setSession(s) {
                    this.current = s;
                    this.pending = null;
                },

                setPending(step) {
                    this.pending = step;
                }
            });

            function mk(name, state) { return { name, state }; }

            // What the stepper shows while waiting for an LLM call
            function stagesFor(pendingStep) {
                const order = ['Analysis', 'Decision', 'Compile', 'Test'];
                const idx = order.indexOf(pendingStep);
                return order.map((name, i) => mk(
                    name,
                    i < idx ? 'done' : (i === idx ? 'active' : 'queued')
                ));
            }

            function computeStages(stage) {
                switch (stage) {
                    case 'NEW':
                        return stagesFor('Analysis');
                    case 'AWAITING_ANSWERS':
                        return stagesFor('Decision');
                    case 'READY_TO_IMPLEMENT':
                    case 'IMPLEMENTATION_RUNNING':
                        return stagesFor('Compile');
                    case 'IMPLEMENTATION_READY':
                        return stagesFor('Test');
                    case 'IMPLEMENTATION_FAILED':
                    case 'BLOCKED':
                    case 'CAPPED':
                    case 'ERROR':
                        return [mk('Analysis', 'done'), mk('Decision', 'done'), mk('Compile', 'queued'), mk('Test', 'queued')];
                    default:
                        return order.map(n => mk(n, 'queued'));
                }
            }

            // keep the const for safety
            const order = ['Analysis', 'Decision', 'Compile', 'Test'];

            // Populate from latest session
            fetch('/pipeline/sessions?limit=1')
                .then(r => r.ok ? r.json() : [])
                .then(arr => {
                    if (!arr || arr.length === 0) return;
                    return fetch('/pipeline/session/' + arr[0].sessionId)
                        .then(r => r.ok ? r.json() : null)
                        .then(s => { if (s) Alpine.store('session').setSession(s); });
                })
                .catch(() => { });
        });

        // Fallback: if alpine:init never fires (Alpine failed to load), do nothing
        window.addEventListener('error', (e) => {
            if (e.message && e.message.includes('Alpine')) {
                console.error('Alpine failed to load — pipeline stepper will not update:', e);
            }
        });
    </script>
