<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" class="grid grid-cols-3 gap-5">

    <!-- Left column: form + list -->
    <div class="col-span-2 space-y-5">

        <!-- Add repo form -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
            <div class="flex items-center justify-between pb-3">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-lg bg-slate-100 flex items-center justify-center text-blue-600">
                        <span class="material-symbols-outlined text-[15px]">folder_open</span>
                    </span>
                    <h2 class="text-[14px] font-semibold text-slate-900">Add Local Repository Target</h2>
                </div>
                <span class="text-[10px] font-semibold text-slate-500 bg-slate-50 px-2 py-0.5 rounded-full uppercase tracking-wider">v2</span>
            </div>

            <form th:action="@{/repositories/add}" method="post" id="repo-form" class="space-y-3">
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label for="repo-id" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Repository ID</label>
                        <input id="repo-id" type="text" name="id" required placeholder="core-identity-svc"
                               class="w-full h-8 px-3 rounded-md bg-slate-50 border border-transparent font-mono text-[12px] text-slate-800 placeholder:text-slate-400 focus:outline-none focus:bg-white focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                    <div class="col-span-2">
                        <label for="repo-path" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Absolute Filesystem Path</label>
                        <input id="repo-path" type="text" name="path" required placeholder="D:\Projects\billing-service"
                               class="w-full h-8 px-3 rounded-md bg-slate-50 border border-transparent font-mono text-[12px] text-slate-800 placeholder:text-slate-400 focus:outline-none focus:bg-white focus:border-blue-400 focus:ring-2 focus:ring-blue-100 transition">
                    </div>
                </div>

                <div th:if="${error}" th:text="${error}"
                     class="rounded-md bg-red-50 border border-red-200 p-2.5 text-[12px] text-red-700 font-mono"></div>

                <div class="flex justify-end">
                    <button type="submit"
                            class="h-8 px-3.5 rounded-md bg-blue-600 text-white hover:bg-blue-700 font-medium text-[13px] flex items-center gap-1.5 shadow-sm transition disabled:bg-slate-300">
                        <span class="material-symbols-outlined text-[16px]">save</span>
                        Save Configuration
                    </button>
                </div>
            </form>
        </div>

        <!-- Repositories list -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <h3 class="text-[14px] font-semibold text-slate-900">Monitored Mapped Directories</h3>
                    <span class="font-mono text-[11px] bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded-full"
                          th:text="${repositories != null ? repositories.size() : 0}">0</span>
                </div>
                <button type="button"
                        th:attr="hx-post=@{/repositories/build-all}, hx-swap='none'"
                        class="h-7 px-2.5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-800 font-medium text-[12px] flex items-center gap-1 transition">
                    <span class="material-symbols-outlined text-[14px]">bolt</span>
                    <span class="whitespace-nowrap">Build All Outdated</span>
                </button>
            </div>

            <div class="p-2 bg-slate-50 space-y-1.5">
                <div th:if="${repositories == null or repositories.empty}"
                     class="text-center py-8 text-[12px] text-slate-500 italic font-mono">
                    No repository targets configured.
                </div>

                <div th:each="repo : ${repositories}"
                     class="bg-white rounded-lg p-2.5 flex flex-col gap-1.5 border border-slate-100 hover:border-slate-200 transition">

                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2 min-w-0">
                            <span class="w-1.5 h-1.5 rounded-full shrink-0"
                                  th:classappend="${repo.status.name() == 'INDEXED'} ? 'bg-emerald-500' :
                                                   (${repo.status.name() == 'STALE'} ? 'bg-amber-500' :
                                                   (${repo.status.name() == 'NEEDS_REINDEX'} ? 'bg-purple-500' :
                                                   (${repo.status.name() == 'FAILED'} ? 'bg-red-500' : 'bg-slate-400')))"></span>
                            <span class="font-mono text-[12px] font-medium text-slate-900 truncate" th:text="${repo.id}">repo</span>
                        </div>

                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold shrink-0"
                              th:classappend="${repo.status.name() == 'INDEXED'} ? 'bg-emerald-50 text-emerald-800' :
                                               (${repo.status.name() == 'STALE'} ? 'bg-amber-50 text-amber-800' :
                                               (${repo.status.name() == 'NEEDS_REINDEX'} ? 'bg-purple-50 text-purple-800' :
                                               (${repo.status.name() == 'FAILED'} ? 'bg-red-50 text-red-800' : 'bg-slate-100 text-slate-700')))"
                              th:text="${repo.status.name()}">STATUS</span>
                    </div>

                    <div class="flex items-center justify-between gap-2">
                        <span class="font-mono text-[11px] text-slate-500 truncate flex-1" th:text="${repo.path}">/path</span>
                        <button type="button"
                                th:attr="hx-post=@{/repositories/build/{id}(id=${repo.id})}, hx-swap='none'"
                                class="h-6 px-2 rounded-md font-medium text-[11px] shrink-0 transition"
                                th:classappend="${repo.status.name() == 'INDEXED'} ? 'bg-slate-100 text-slate-700 hover:bg-slate-200' : 'bg-blue-600 text-white hover:bg-blue-700'"
                                th:text="${repo.status.name() == 'INDEXED'} ? 'Re-index' : 'Index Repository'">
                            Index
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right column: token stats -->
    <div class="col-span-1 space-y-5">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-3">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-blue-600 text-[18px]">memory</span>
                <h3 class="text-[14px] font-semibold text-slate-900">Token Optimization</h3>
            </div>

            <div class="rounded-lg bg-slate-50 p-3">
                <div class="flex items-center justify-between">
                    <span class="text-[12px] font-medium text-slate-700">Caveman Slicer</span>
                    <span class="font-mono text-[14px] font-semibold text-emerald-600">65%</span>
                </div>
                <div class="mt-2 h-1 bg-slate-200 rounded-full overflow-hidden">
                    <div class="h-full bg-emerald-500 rounded-full" style="width: 65%;"></div>
                </div>
                <p class="text-[10px] text-slate-500 mt-1 font-mono">-12.4k tokens</p>
            </div>

            <div class="rounded-lg bg-slate-50 p-3">
                <div class="flex items-center justify-between">
                    <span class="text-[12px] font-medium text-slate-700">Ponytail Minimizer</span>
                    <span class="font-mono text-[14px] font-semibold text-amber-600">54%</span>
                </div>
                <div class="mt-2 h-1 bg-slate-200 rounded-full overflow-hidden">
                    <div class="h-full bg-amber-500 rounded-full" style="width: 54%;"></div>
                </div>
                <p class="text-[10px] text-slate-500 mt-1 font-mono">-8.1k tokens</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
