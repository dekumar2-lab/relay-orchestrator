                        <!-- RIGHT COLUMN: pipeline journey -->
            <div class="col-span-1">
                <div class="sticky top-4 space-y-4 max-h-[calc(100vh-2rem)] overflow-y-auto pr-1">

                    <!-- Pipeline Journey -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-blue-600 text-[18px]">route</span>
                                <h3 class="text-[14px] font-semibold text-slate-900">Pipeline</h3>
                            </div>
                            <span x-show="session"
                                  class="inline-flex items-center px-2 py-0.5 rounded-full text-[9px] font-semibold uppercase tracking-wider"
                                  :class="intentBadgeClass()"
                                  x-text="intent"></span>
                        </div>

                        <div class="px-4 py-3">
                            <template x-for="(step, idx) in journey" :key="step.key">
                                <div class="flex items-start gap-3">
                                    <div class="flex flex-col items-center shrink-0" style="min-width: 20px;">
                                        <div class="w-5 h-5 rounded-full flex items-center justify-center"
                                             :class="stepDotClass(step.state)">
                                            <template x-if="step.state === 'done'">
                                                <span class="material-symbols-outlined text-[12px] text-white">check</span>
                                            </template>
                                            <template x-if="step.state === 'active'">
                                                <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                                            </template>
                                            <template x-if="step.state === 'waiting'">
                                                <span class="w-2 h-2 rounded-full bg-white"></span>
                                            </template>
                                            <template x-if="step.state === 'failed'">
                                                <span class="material-symbols-outlined text-[12px] text-white">close</span>
                                            </template>
                                            <template x-if="step.state === 'queued'">
                                                <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                                            </template>
                                            <template x-if="step.state === 'optional'">
                                                <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                                            </template>
                                        </div>
                                        <template x-if="idx < journey.length - 1">
                                            <div class="w-px flex-1 my-0.5 min-h-[18px]"
                                                 :class="step.state === 'done' ? 'bg-emerald-300' : 'bg-slate-200'"></div>
                                        </template>
                                    </div>

                                    <div class="flex-1 min-w-0 pb-3">
                                        <p class="text-[12px] font-semibold leading-tight"
                                           :class="stepLabelClass(step.state)"
                                           x-text="step.name"></p>
                                        <p class="text-[10px] mt-0.5 leading-tight"
                                           :class="step.state === 'optional' ? 'text-slate-400 italic' : 'text-slate-500'"
                                           x-text="step.detail"></p>
                                    </div>
                                </div>
                            </template>

                            <template x-if="!session">
                                <p class="text-[11px] text-slate-400 italic pt-1">
                                    Submit a story to see the pipeline.
                                </p>
                            </template>
                        </div>
                    </div>

                    <!-- Token Pipeline (compact) -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-blue-600 text-[16px]">memory</span>
                            <h3 class="text-[13px] font-semibold text-slate-900">Token Pipeline</h3>
                        </div>
                        <div class="rounded-lg bg-slate-50 p-3 space-y-1">
                            <div class="flex items-center gap-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
                                <span class="text-[12px] font-medium text-slate-800">Prompt Caching</span>
                            </div>
                            <p class="text-[11px] text-slate-500 leading-relaxed">
                                Active when system prompt exceeds ~1024 tokens.
                            </p>
                        </div>
                        <div class="pt-1 flex justify-end">
                            <a th:href="@{/token-tracker}"
                               class="inline-flex items-center gap-1 text-[12px] font-medium text-blue-700 hover:text-blue-800 transition">
                                View Token Tracker
                                <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alpine component -->
        <script>
            function pipelinePage() {
                return {
                    story: '',
                    running: false,
                    submitting: false,
                    implementing: false,
                    generatingPlan: false,
                    generatingReview: false,
                    reimplementing: false,
                    session: null,
                    answers: {},
                    additionalContext: '',
                    error: '',
                    copied: false,
                    previewOpen: false,

                    artifacts: [],
                    plan: null,
                    review: null,
                    planExpanded: true,
                    artifactError: '',
                    recent: [],

                    testResult: null,
                    runningTests: false,

                    explainArtifact: null,
                    docArtifact: null,
                    generatingExplain: false,
                    generatingDoc: false,

                    init() {
                        const params = new URLSearchParams(window.location.search);
                        const id = params.get('session') || localStorage.getItem('relay.lastSessionId');
                        if (id) this.restoreLastSession(id);
                    },

                    get stages() {
                        const ORDER = ['Clarify', 'Plan', 'Approve', 'Implement', 'Review', 'Apply'];
                        const mk = (name, state) => ({ name, state });
                        const stagesFor = (step) => {
                            const idx = ORDER.indexOf(step);
                            if (idx < 0) return ORDER.map(n => mk(n, 'queued'));
                            return ORDER.map((name, i) =>
                                mk(name, i < idx ? 'done' : (i === idx ? 'active' : 'queued')));
                        };
                        const stage = this.session?.stage || 'NEW';

                        if (stage === 'BLOCKED' || stage === 'CAPPED' || stage === 'ERROR'
                            || stage === 'IMPLEMENTATION_FAILED') {
                            return [mk('Clarify', 'done'), mk('Plan', 'done'), mk('Approve', 'done'),
                            mk('Implement', 'active'), mk('Review', 'queued'), mk('Apply', 'queued')];
                        }
                        if (stage === 'APPLIED') return ORDER.map(n => mk(n, 'done'));
                        if (stage === 'AWAITING_ANSWERS' || stage === 'NEW') return stagesFor('Clarify');

                        if (this.plan && this.plan.status === 'DRAFT') return stagesFor('Approve');
                        if (this.plan && this.plan.status === 'APPROVED') return stagesFor('Implement');
                        if (this.plan && this.plan.status === 'EXECUTED') {
                            if (!this.review) return stagesFor('Review');
                            if (this.review.verdict === 'APPROVE') return stagesFor('Apply');
                            return stagesFor('Implement');
                        }
                        if (stage === 'READY_TO_IMPLEMENT') return stagesFor('Plan');
                        if (stage === 'IMPLEMENTATION_RUNNING') return stagesFor('Implement');
                        return stagesFor('Clarify');
                    },

                    get intent() {
                        return this.session?.recommendedIntent || 'PLAN';
                    },

                                        // ============================================================
                    // Pipeline journey — computed steps per intent
                    // ============================================================

                    get journey() {
                        const intent = this.intent;
                        const s = this.session;
                        const hasSession = !!s;
                        const stage = s?.stage || 'NEW';
                        const steps = [];

                        // ---- Clarify ----
                        let cState = 'queued';
                        let cDetail = 'Submit a story to begin';
                        if (this.running) {
                            cState = 'active';
                            cDetail = 'Analyzing story...';
                        } else if (hasSession && stage !== 'NEW') {
                            if (stage === 'AWAITING_ANSWERS') {
                                cState = 'waiting';
                                cDetail = `Q${s.turnCount || 1}/${s.maxTurns || 3} · awaiting your answer`;
                            } else if (stage === 'BLOCKED') {
                                cState = 'failed';
                                cDetail = 'Story blocked';
                            } else if (stage === 'CAPPED') {
                                cState = 'failed';
                                cDetail = 'Turn cap reached';
                            } else {
                                cState = 'done';
                                cDetail = `Completed in ${s.turnCount || 0} turn(s)`;
                            }
                        }
                        steps.push({ key: 'clarify', name: 'Clarify', state: cState, detail: cDetail });

                        if (intent === 'EXPLAIN') {
                            steps.push(this.buildAnalyzeStep());
                            return steps;
                        }
                        if (intent === 'DOCUMENT') {
                            steps.push(this.buildDocumentStep());
                            return steps;
                        }
                        if (intent === 'REVIEW') {
                            steps.push(this.buildStandaloneReviewStep());
                            return steps;
                        }

                        if (intent === 'PLAN') {
                            steps.push(this.buildPlanStep());
                            steps.push(this.buildApproveStep());
                        }
                        steps.push(this.buildImplementStep());
                        steps.push(this.buildReviewStep());
                        steps.push(this.buildTestStep());
                        steps.push(this.buildApplyStep());
                        return steps;
                    },

                    buildPlanStep() {
                        const p = this.plan;
                        if (this.generatingPlan) {
                            return { key: 'plan', name: 'Plan', state: 'active', detail: 'Generating implementation plan...' };
                        }
                        if (!p) {
                            const ready = this.session?.stage === 'READY_TO_IMPLEMENT';
                            return { key: 'plan', name: 'Plan', state: ready ? 'waiting' : 'queued',
                                     detail: ready ? 'Ready to generate' : 'Runs after clarification' };
                        }
                        if (p.status === 'DRAFT') {
                            return { key: 'plan', name: 'Plan', state: 'done', detail: 'Draft generated' };
                        }
                        if (p.status === 'REJECTED') {
                            return { key: 'plan', name: 'Plan', state: 'failed', detail: 'Rejected · regenerate to retry' };
                        }
                        if (p.status === 'APPROVED' || p.status === 'EXECUTED') {
                            return { key: 'plan', name: 'Plan', state: 'done', detail: 'Draft approved' };
                        }
                        return { key: 'plan', name: 'Plan', state: 'queued', detail: '' };
                    },

                    buildApproveStep() {
                        const p = this.plan;
                        if (!p) {
                            return { key: 'approve', name: 'Approve', state: 'queued', detail: 'Runs after plan is drafted' };
                        }
                        if (p.status === 'DRAFT') {
                            return { key: 'approve', name: 'Approve', state: 'waiting', detail: 'Waiting for your decision' };
                        }
                        if (p.status === 'REJECTED') {
                            return { key: 'approve', name: 'Approve', state: 'failed', detail: 'Plan rejected' };
                        }
                        if (p.status === 'APPROVED' || p.status === 'EXECUTED') {
                            return { key: 'approve', name: 'Approve', state: 'done', detail: 'Approved by ' + (p.approvedBy || 'you') };
                        }
                        return { key: 'approve', name: 'Approve', state: 'queued', detail: '' };
                    },

                    buildImplementStep() {
                        const stage = this.session?.stage;
                        const hasDiff = !!(this.session?.implementationResult
                                            && this.session.implementationResult.files?.length);
                        if (this.implementing || stage === 'IMPLEMENTATION_RUNNING') {
                            return { key: 'implement', name: 'Implement', state: 'active', detail: 'Agent is writing the diff...' };
                        }
                        if (stage === 'IMPLEMENTATION_FAILED') {
                            return { key: 'implement', name: 'Implement', state: 'failed', detail: 'Implementer failed' };
                        }
                        if (hasDiff || stage === 'IMPLEMENTATION_READY' || stage === 'APPLIED') {
                            const n = this.session.implementationResult?.files?.length || 0;
                            return { key: 'implement', name: 'Implement', state: 'done', detail: `${n} file(s) changed` };
                        }
                        if (this.intent === 'FIX' && stage === 'READY_TO_IMPLEMENT') {
                            return { key: 'implement', name: 'Implement', state: 'waiting', detail: 'Ready — fast path skips plan' };
                        }
                        if (this.intent === 'PLAN' && this.plan && this.plan.status === 'APPROVED') {
                            return { key: 'implement', name: 'Implement', state: 'waiting', detail: 'Ready — plan approved' };
                        }
                        const after = this.intent === 'FIX' ? 'clarification' : 'plan approval';
                        return { key: 'implement', name: 'Implement', state: 'queued', detail: 'Runs after ' + after };
                    },

                    buildReviewStep() {
                        const r = this.review;
                        if (this.generatingReview) {
                            return { key: 'review', name: 'Review', state: 'active', detail: 'Reviewer is auditing the diff...' };
                        }
                        if (r) {
                            const verdict = (r.verdict || 'COMMENT').toUpperCase();
                            if (verdict === 'APPROVE') {
                                return { key: 'review', name: 'Review', state: 'done', detail: 'Approved by ' + r.createdBy };
                            }
                            if (verdict === 'REQUEST_CHANGES') {
                                return { key: 'review', name: 'Review', state: 'failed', detail: 'Changes requested by ' + r.createdBy };
                            }
                            return { key: 'review', name: 'Review', state: 'done', detail: 'Commented by ' + r.createdBy };
                        }
                        const hasDiff = !!(this.session?.implementationResult
                                            && this.session.implementationResult.files?.length);
                        if (hasDiff) {
                            return { key: 'review', name: 'Review', state: 'optional', detail: 'Optional · generate for a second opinion' };
                        }
                        return { key: 'review', name: 'Review', state: 'queued', detail: 'Runs after implement' };
                    },

                    buildStandaloneReviewStep() {
                        if (this.generatingReview) {
                            return { key: 'review', name: 'Review', state: 'active', detail: 'Reviewer is auditing...' };
                        }
                        const r = this.review;
                        if (r) {
                            const verdict = (r.verdict || 'COMMENT').toUpperCase();
                            const label = verdict === 'APPROVE' ? 'Approved' : verdict === 'REQUEST_CHANGES' ? 'Changes requested' : 'Commented';
                            return { key: 'review', name: 'Review', state: 'done', detail: label + ' by ' + r.createdBy };
                        }
                        const ready = this.session?.stage === 'READY_TO_IMPLEMENT';
                        return { key: 'review', name: 'Review', state: ready ? 'waiting' : 'queued',
                                 detail: ready ? 'Ready to review the named file(s)' : 'Runs after clarification' };
                    },

                    buildTestStep() {
                        const t = this.testResult;
                        if (this.runningTests) {
                            return { key: 'test', name: 'Test', state: 'active', detail: 'Running mvn clean test...' };
                        }
                        if (t) {
                            if (t.status === 'TESTS_PASSED') {
                                return { key: 'test', name: 'Test', state: 'done',
                                         detail: `${t.passedTests} passed in ${(t.durationMs / 1000).toFixed(1)}s` };
                            }
                            if (t.status === 'COMPILE_FAILED') {
                                return { key: 'test', name: 'Test', state: 'failed', detail: 'Compile failed — see report below' };
                            }
                            if (t.status === 'TIMEOUT') {
                                return { key: 'test', name: 'Test', state: 'failed', detail: 'Timed out after 600s' };
                            }
                            return { key: 'test', name: 'Test', state: 'failed',
                                     detail: `${t.failedTests} failed · ${t.passedTests} passed` };
                        }
                        const hasDiff = !!(this.session?.implementationResult
                                            && this.session.implementationResult.files?.length);
                        if (hasDiff) {
                            return { key: 'test', name: 'Test', state: 'waiting', detail: 'Ready to run test harness' };
                        }
                        return { key: 'test', name: 'Test', state: 'queued', detail: 'Runs after implement' };
                    },

                    buildApplyStep() {
                        const stage = this.session?.stage;
                        const t = this.testResult;
                        if (stage === 'APPLIED') {
                            return { key: 'apply', name: 'Apply', state: 'done', detail: 'Diff is on disk' };
                        }
                        if (t && t.status === 'TESTS_PASSED') {
                            return { key: 'apply', name: 'Apply', state: 'done', detail: 'Diff is on disk (auto-applied by tests)' };
                        }
                        if (stage === 'IMPLEMENTATION_READY') {
                            return { key: 'apply', name: 'Apply', state: 'waiting', detail: 'Ready to write to disk' };
                        }
                        return { key: 'apply', name: 'Apply', state: 'queued', detail: 'Runs after tests pass' };
                    },

                    buildAnalyzeStep() {
                        if (this.generatingExplain) {
                            return { key: 'analyze', name: 'Analyze', state: 'active', detail: 'Generating analysis...' };
                        }
                        if (this.explainArtifact) {
                            return { key: 'analyze', name: 'Analyze', state: 'done', detail: 'Artifact ' + this.explainArtifact.shortId };
                        }
                        const ready = this.session?.stage === 'READY_TO_IMPLEMENT';
                        return { key: 'analyze', name: 'Analyze', state: ready ? 'waiting' : 'queued',
                                 detail: ready ? 'Ready to generate analysis' : 'Runs after clarification' };
                    },

                    buildDocumentStep() {
                        if (this.generatingDoc) {
                            return { key: 'document', name: 'Document', state: 'active', detail: 'Generating docs...' };
                        }
                        if (this.docArtifact) {
                            return { key: 'document', name: 'Document', state: 'done', detail: 'Artifact ' + this.docArtifact.shortId };
                        }
                        const ready = this.session?.stage === 'READY_TO_IMPLEMENT';
                        return { key: 'document', name: 'Document', state: ready ? 'waiting' : 'queued',
                                 detail: ready ? 'Ready to generate docs' : 'Runs after clarification' };
                    },

                    stepDotClass(state) {
                        switch (state) {
                            case 'done':     return 'bg-emerald-500';
                            case 'active':   return 'bg-blue-600';
                            case 'waiting':  return 'bg-amber-500';
                            case 'failed':   return 'bg-red-500';
                            case 'optional': return 'bg-white border border-dashed border-slate-400';
                            default:         return 'bg-white border border-slate-300';
                        }
                    },

                    stepLabelClass(state) {
                        switch (state) {
                            case 'done':     return 'text-slate-700';
                            case 'active':   return 'text-blue-700';
                            case 'waiting':  return 'text-amber-700';
                            case 'failed':   return 'text-red-700';
                            case 'optional': return 'text-slate-500';
                            default:         return 'text-slate-400';
                        }
                    },

                    intentBadgeClass() {
                        switch (this.intent) {
                            case 'FIX':      return 'bg-amber-100 text-amber-800';
                            case 'EXPLAIN':  return 'bg-blue-100 text-blue-800';
                            case 'DOCUMENT': return 'bg-emerald-100 text-emerald-800';
                            case 'REVIEW':   return 'bg-slate-100 text-slate-700';
                            default:         return 'bg-violet-100 text-violet-800';
                        }
                    },

                    get syntaxLabel() {
                        if (!this.story.trim()) return 'Empty';
                        if (this.story.length < 20) return 'Brief';
                        return 'Clean spec';
                    },

                    get allAnswered() {
                        if (!this.session || !this.session.questions) return false;
                        return this.session.questions.every(q => (this.answers[q.id] || '').trim().length > 0);
                    },

                    busy() {
                        return this.running || this.submitting || this.implementing
                            || this.generatingPlan || this.generatingReview
                            || this.reimplementing || this.runningTests
                            || this.generatingExplain || this.generatingDoc;
                    },

                    pendingIs(step) {
                        if (window.Alpine?.store('session')) {
                            return Alpine.store('session').pending === step;
                        }
                        return false;
                    },

                    setPending(step) {
                        if (window.Alpine?.store('session')) {
                            Alpine.store('session').setPending(step);
                        }
                    },

                    clearPending() {
                        if (window.Alpine?.store('session')) {
                            Alpine.store('session').setPending(null);
                        }
                    },

                    renderInline(text) {
                        if (!text) return '';
                        const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        return escaped.replace(/`([^`]+)`/g,
                            '<code class="px-1 py-0.5 rounded bg-slate-200 text-slate-800 font-mono text-[11px]">$1</code>');
                    },

                    renderMarkdown(text) {
                        if (!text) return '';
                        try { return marked.parse(text); }
                        catch (e) { return '<pre>' + text.replace(/</g, '&lt;') + '</pre>'; }
                    },

                    testStatusClass() {
                        if (!this.testResult) return 'border-slate-200 bg-white';
                        switch (this.testResult.status) {
                            case 'TESTS_PASSED': return 'border-emerald-200 bg-emerald-50';
                            case 'TESTS_FAILED': return 'border-red-200 bg-red-50';
                            case 'COMPILE_FAILED': return 'border-red-200 bg-red-50';
                            case 'TIMEOUT': return 'border-amber-200 bg-amber-50';
                            default: return 'border-slate-200 bg-white';
                        }
                    },

                    async restoreLastSession(id) {
                        try {
                            const res = await fetch('/pipeline/session/' + id);
                            if (!res.ok) {
                                this.error = 'Session not found: ' + id.slice(0, 8);
                                localStorage.removeItem('relay.lastSessionId');
                                return;
                            }
                            this.setSession(await res.json());
                        } catch (e) {
                            this.error = 'Failed to load session: ' + e.message;
                        }
                    },

                    setSession(s) {
                        this.session = s;
                        this.clearPending();
                        if (window.Alpine && Alpine.store('session')) {
                            Alpine.store('session').setSession(s);
                        }
                        if (s && s.sessionId) {
                            localStorage.setItem('relay.lastSessionId', s.sessionId);
                        }
                        this.loadArtifacts();
                    },

                    loadSample() {
                        const samples = [
                            'feat(auth): Add biometric passkey authentication fallback with rate limiting on failed attempts',
                            'fix(router): Resolve race condition during parallel pipeline stage compilation',
                            'refactor(db): Migrate session credential metadata to Redis with automatic TTL',
                            'perf(compiler): Parallel AST symbol resolution for monorepo dependency graphs'
                        ];
                        const idx = samples.indexOf(this.story);
                        this.story = samples[(idx + 1) % samples.length];
                    },

                    async startClarification() {
                        if (!this.story.trim() || this.running) return;
                        this.running = true;
                        this.error = '';
                        this.setPending('Clarify');
                        try {
                            const res = await fetch('/pipeline/clarify', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ story: this.story })
                            });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Failed to start session');
                            this.setSession(data);
                            this.answers = {};
                            this.additionalContext = '';
                        } catch (e) { this.error = e.message; }
                        finally { this.running = false; this.clearPending(); }
                    },

                    async submitAnswers() {
                        if (!this.session || this.submitting) return;
                        this.submitting = true;
                        this.error = '';
                        this.setPending('Plan');
                        try {
                            const payload = {
                                sessionId: this.session.sessionId,
                                answers: Object.entries(this.answers).map(([qid, ans]) => ({
                                    questionId: qid, answer: ans
                                })),
                                additionalContext: this.additionalContext
                            };
                            const res = await fetch('/pipeline/clarify/resume', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Resume failed');
                            this.setSession(data);
                            this.answers = {};
                            this.additionalContext = '';
                        } catch (e) { this.error = e.message; }
                        finally { this.submitting = false; this.clearPending(); }
                    },

                    async loadRecent() {
                        try {
                            const res = await fetch('/pipeline/sessions?limit=20');
                            if (!res.ok) return;
                            this.recent = await res.json();
                        } catch (_) { this.recent = []; }
                    },

                    async loadSession(id) {
                        this.error = '';
                        try {
                            const res = await fetch('/pipeline/session/' + id);
                            if (!res.ok) throw new Error('Session not found');
                            this.setSession(await res.json());
                            const url = new URL(window.location.href);
                            url.searchParams.set('session', id);
                            window.history.replaceState({}, '', url);
                        } catch (e) { this.error = e.message; }
                    },

                    async loadArtifacts() {
                        this.artifacts = [];
                        this.plan = null;
                        this.review = null;
                        this.explainArtifact = null;
                        this.docArtifact = null;
                        this.testResult = null;
                        if (!this.session) return;
                        try {
                            const res = await fetch('/pipeline/' + this.session.sessionId + '/artifacts');
                            if (!res.ok) return;
                            const list = await res.json();
                            this.artifacts = list;

                            const plans = list.filter(a => a.kind === 'PLAN');
                            this.plan = plans.length > 0 ? plans[plans.length - 1] : null;

                            const reviews = list.filter(a => a.kind === 'REVIEW');
                            this.review = reviews.length > 0 ? reviews[0] : null;
                            this.planExpanded = !this.review;

                            const explains = list.filter(a => a.kind === 'EXPLAIN');
                            this.explainArtifact = explains.length > 0 ? explains[explains.length - 1] : null;

                            const docs = list.filter(a => a.kind === 'DOC');
                            this.docArtifact = docs.length > 0 ? docs[docs.length - 1] : null;

                            const testRuns = list.filter(a => a.kind === 'TEST_RUN');
                            const latest = testRuns.length > 0 ? testRuns[testRuns.length - 1] : null;
                            if (latest) {
                                try { this.testResult = JSON.parse(latest.content); }
                                catch (_) { this.testResult = null; }
                            }
                        } catch (_) { }
                    },

                    async generatePlan() {
                        if (!this.session || this.generatingPlan) return;
                        this.generatingPlan = true;
                        this.artifactError = '';
                        this.setPending('Plan');
                        try {
                            const res = await fetch('/pipeline/' + this.session.sessionId + '/artifact/plan',
                                { method: 'POST' });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Failed to generate plan');
                            this.planExpanded = true;
                            await this.loadArtifacts();
                        } catch (e) { this.artifactError = e.message; }
                        finally { this.generatingPlan = false; this.clearPending(); }
                    },

                    async runFix() {
                        if (!this.session || this.implementing) return;
                        this.implementing = true;
                        this.setPending('Implement');
                        this.error = '';
                        try {
                            const res = await fetch('/pipeline/' + this.session.sessionId + '/fix',
                                { method: 'POST' });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Fix failed to start');
                            this.pollForDiff();
                        } catch (e) {
                            this.error = e.message;
                            this.implementing = false;
                            this.clearPending();
                        }
                    },

                    async generateExplain() {
                        if (!this.session || this.generatingExplain) return;
                        this.generatingExplain = true;
                        this.explainArtifact = null;
                        this.artifactError = '';
                        try {
                            const res = await fetch('/pipeline/' + this.session.sessionId + '/artifact/explain',
                                { method: 'POST' });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Failed to generate explanation');
                            this.explainArtifact = data;
                        } catch (e) { this.artifactError = e.message; }
                        finally { this.generatingExplain = false; }
                    },

                    async generateDoc() {
                        if (!this.session || this.generatingDoc) return;
                        this.generatingDoc = true;
                        this.docArtifact = null;
                        this.artifactError = '';
                        try {
                            const res = await fetch('/pipeline/' + this.session.sessionId + '/artifact/doc',
                                { method: 'POST' });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Failed to generate docs');
                            this.docArtifact = data;
                        } catch (e) { this.artifactError = e.message; }
                        finally { this.generatingDoc = false; }
                    },

                    async runTests() {
                        if (!this.session || this.runningTests) return;
                        this.runningTests = true;
                        this.error = '';
                        try {
                            const res = await fetch('/pipeline/' + this.session.sessionId + '/run-tests',
                                { method: 'POST' });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Test run failed');
                            this.testResult = data.result;
                            await this.loadSession(this.session.sessionId);
                        } catch (e) { this.error = e.message; }
                        finally { this.runningTests = false; }
                    },

                    async approvePlan() {
                        if (!this.plan) return;
                        this.artifactError = '';
                        try {
                            const res = await fetch('/artifact/' + this.plan.id + '/approve', { method: 'POST' });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Approve failed');
                            await this.loadArtifacts();
                        } catch (e) { this.artifactError = e.message; }
                    },

                    async rejectPlan() {
                        if (!this.plan) return;
                        this.artifactError = '';
                        try {
                            const res = await fetch('/artifact/' + this.plan.id + '/reject', { method: 'POST' });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Reject failed');
                            await this.loadArtifacts();
                        } catch (e) { this.artifactError = e.message; }
                    },

                    async generateReview() {
                        if (!this.session || this.generatingReview) return;
                        this.generatingReview = true;
                        this.artifactError = '';
                        this.setPending('Review');
                        try {
                            const res = await fetch('/pipeline/' + this.session.sessionId + '/artifact/review',
                                { method: 'POST' });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Failed to generate review');
                            await this.loadArtifacts();
                        } catch (e) { this.artifactError = e.message; }
                        finally { this.generatingReview = false; this.clearPending(); }
                    },

                    async reimplement() {
                        if (!this.session || this.reimplementing) return;
                        this.reimplementing = true;
                        this.artifactError = '';
                        this.setPending('Implement');

                        // Do NOT null testResult here — keep the failure list
                        // visible while Jim works, so the user can read what's
                        // being fixed.

                        try {
                            const res = await fetch('/pipeline/' + this.session.sessionId + '/reimplement',
                                { method: 'POST' });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Re-implementation failed');

                            // Drop the review — it's been consumed.
                            this.review = null;

                            // Reload session so the stage badge flips to IMPLEMENTATION_RUNNING.
                            try {
                                const s = await fetch('/pipeline/session/' + this.session.sessionId)
                                    .then(r => r.json());
                                this.session = s;
                                if (window.Alpine && Alpine.store('session')) {
                                    Alpine.store('session').setSession(s);
                                }
                            } catch (_) { /* ignore */ }

                            // Leave reimplementing = true; pollForDiff clears it.
                            this.pollForDiff();
                        } catch (e) {
                            this.artifactError = e.message;
                            this.reimplementing = false;
                            this.clearPending();
                        }
                    },

                    async undoApply() {
                        if (!this.session) return;
                        if (!confirm('Revert the applied fix? The file will be restored from the backup.')) return;
                        this.runningTests = true;
                        this.error = '';
                        try {
                            const res = await fetch('/pipeline/' + this.session.sessionId + '/undo',
                                { method: 'POST' });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Undo failed');
                            this.testResult = null;
                            await this.loadSession(this.session.sessionId);
                        } catch (e) {
                            this.error = e.message;
                        } finally {
                            this.runningTests = false;
                        }
                    },

                    async runImplementer() {
                        if (!this.session || this.implementing) return;
                        this.implementing = true;
                        this.error = '';
                        this.setPending('Implement');
                        try {
                            const res = await fetch('/pipeline/implement', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ sessionId: this.session.sessionId })
                            });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error || 'Implementer failed to start');
                            this.pollForDiff();
                        } catch (e) {
                            this.error = e.message;
                            this.implementing = false;
                            this.clearPending();
                        }
                    },

                    pollForDiff() {
                        const id = this.session.sessionId;
                        const started = Date.now();
                        const timer = setInterval(async () => {
                            try {
                                const res = await fetch('/pipeline/session/' + id);
                                const data = await res.json();
                                if (data.stage === 'IMPLEMENTATION_READY'
                                    || data.stage === 'IMPLEMENTATION_FAILED') {
                                    clearInterval(timer);
                                    this.implementing = false;
                                    this.reimplementing = false;
                                    this.setSession(data);
                                }
                            } catch (_) { }
                            if (Date.now() - started > 10 * 60 * 1000) {
                                clearInterval(timer);
                                this.implementing = false;
                                this.reimplementing = false;
                                this.error = 'Implementer timed out. Check the live log.';
                                this.clearPending();
                            }
                        }, 3000);
                    },

                    copySessionId() {
                        if (!this.session) return;
                        if (navigator.clipboard) navigator.clipboard.writeText(this.session.sessionId);
                        this.copied = true;
                        setTimeout(() => this.copied = false, 1500);
                    },

                    reset() {
                        this.setSession(null);
                        this.story = '';
                        this.answers = {};
                        this.additionalContext = '';
                        this.error = '';
                        this.artifactError = '';
                        this.previewOpen = false;
                        this.planExpanded = true;
                        this.testResult = null;
                        localStorage.removeItem('relay.lastSessionId');
                    },

                    stageBadgeClass(stage) {
                        switch (stage) {
                            case 'AWAITING_ANSWERS': return 'bg-blue-50 text-blue-700 border-blue-200';
                            case 'READY_TO_IMPLEMENT': return 'bg-emerald-50 text-emerald-700 border-emerald-200';
                            case 'IMPLEMENTATION_RUNNING': return 'bg-blue-50 text-blue-700 border-blue-200';
                            case 'IMPLEMENTATION_READY': return 'bg-emerald-50 text-emerald-700 border-emerald-200';
                            case 'IMPLEMENTATION_FAILED': return 'bg-red-50 text-red-700 border-red-200';
                            case 'APPLIED': return 'bg-emerald-50 text-emerald-700 border-emerald-200';
                            case 'BLOCKED': return 'bg-red-50 text-red-700 border-red-200';
                            case 'CAPPED': return 'bg-amber-50 text-amber-700 border-amber-200';
                            default: return 'bg-slate-50 text-slate-600 border-slate-200';
                        }
                    },

                    planStatusBadge(status) {
                        switch (status) {
                            case 'DRAFT': return 'bg-amber-50 text-amber-700 border-amber-200';
                            case 'APPROVED': return 'bg-emerald-50 text-emerald-700 border-emerald-200';
                            case 'REJECTED': return 'bg-red-50 text-red-700 border-red-200';
                            case 'EXECUTED': return 'bg-blue-50 text-blue-700 border-blue-200';
                            default: return 'bg-slate-100 text-slate-600 border-slate-200';
                        }
                    },

                    verdictBadge(verdict) {
                        switch ((verdict || '').toUpperCase()) {
                            case 'APPROVE': return 'bg-emerald-50 text-emerald-700 border-emerald-200';
                            case 'REQUEST_CHANGES': return 'bg-red-50 text-red-700 border-red-200';
                            case 'COMMENT': return 'bg-amber-50 text-amber-700 border-amber-200';
                            default: return 'bg-slate-100 text-slate-600 border-slate-200';
                        }
                    }
                };
            }
        </script>

        <style>
            [x-cloak] {
                display: none !important;
            }
        </style>
    </div>
</body>
