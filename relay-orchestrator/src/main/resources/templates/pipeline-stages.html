<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="content" x-data="pipelinePage()" x-init="init()">

        <!-- Fixed stepper -->
        <div class="fixed left-64 right-0 top-16 z-30 bg-slate-50 border-b border-slate-200 px-6 py-2">
            
        </div>


        <div class="grid grid-cols-3 gap-5">
            <div class="col-span-2 space-y-5">

                <!-- Feature Story Input -->
                <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="px-5 py-3 border-b border-slate-100 flex items-start justify-between gap-3">
                        <div class="min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-blue-600 text-[18px]">terminal</span>
                                <h2 class="text-[14px] font-semibold text-slate-900 truncate">Feature Story Command
                                    Input</h2>
                            </div>
                            <p class="text-[12px] text-slate-500 mt-0.5">Paste Jira / GitHub ticket or freeform
                                requirement</p>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <div class="relative" x-data="{ open: false }">
                                <button type="button" @click="open = !open; if (open) loadRecent()"
                                    class="h-7 px-2.5 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-[12px] flex items-center gap-1 transition">
                                    <span class="material-symbols-outlined text-[14px]">history</span>
                                    <span>Recent</span>
                                </button>
                                <div x-show="open" @click.outside="open = false" x-cloak
                                    class="absolute right-0 top-full mt-1 w-80 bg-white border border-slate-200 rounded-lg shadow-lg z-40 overflow-hidden">
                                    <div class="px-3 py-2 border-b border-slate-100 bg-slate-50">
                                        <span
                                            class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">Recent
                                            Sessions</span>
                                    </div>
                                    <div class="max-h-72 overflow-y-auto">
                                        <template x-if="recent.length === 0">
                                            <div class="p-4 text-center text-[12px] text-slate-500 italic">No sessions
                                                yet.</div>
                                        </template>
                                        <template x-for="s in recent" :key="s.sessionId">
                                            <div @click="loadSession(s.sessionId); open = false"
                                                class="px-3 py-2 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-b-0 transition">
                                                <div class="flex items-center justify-between gap-2">
                                                    <span class="font-mono text-[11px] text-blue-700 font-medium"
                                                        x-text="s.sessionId.slice(0, 8)"></span>
                                                    <span class="text-[9px] font-semibold px-1.5 py-0.5 rounded-full"
                                                        :class="stageBadgeClass(s.stage)" x-text="s.stage"></span>
                                                </div>
                                                <p class="text-[11px] text-slate-600 truncate mt-0.5"
                                                    x-text="s.originalStory || '(no story)'"></p>
                                                <p class="text-[10px] text-slate-400 font-mono mt-0.5"
                                                    x-text="(s.updatedAt || '').replace('T', ' ').slice(0, 16)"></p>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                            <span
                                class="inline-flex items-center px-2 py-0.5 rounded-full font-mono text-[11px] bg-slate-100 text-slate-600">v2.orchestrate</span>
                        </div>
                    </div>
                    <div class="p-5 space-y-3">
                        <div class="rounded-lg bg-slate-50 p-3">
                            <textarea x-model="story" rows="4" :disabled="running"
                                class="w-full bg-transparent font-mono text-[12px] leading-relaxed text-slate-900 resize-none focus:outline-none placeholder:text-slate-400 disabled:opacity-60"
                                placeholder="e.g. feat(gateway): implement adaptive rate limiter..."></textarea>
                            <div class="flex items-center justify-between pt-2 text-[11px] font-mono">
                                <span class="inline-flex items-center gap-1.5">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                    <span class="text-slate-500" x-text="syntaxLabel"></span>
                                </span>
                                <span class="text-slate-400" x-text="story.length + ' chars'"></span>
                            </div>
                        </div>
                        <div class="flex items-center justify-between gap-2">
                            <button type="button" @click="loadSample()"
                                class="h-8 px-3 rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 font-medium text-[13px] flex items-center gap-1.5 transition">
                                <span class="material-symbols-outlined text-[16px]">refresh</span>
                                Load Sample
                            </button>
                            <button type="button" @click="startClarification()"
                                :disabled="running || !story.trim() || busy()"
                                class="h-8 px-3.5 rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[13px] flex items-center gap-2 shadow-sm transition">
                                <span class="material-symbols-outlined text-[16px]" x-show="!running">bolt</span>
                                <span class="material-symbols-outlined text-[16px] animate-spin"
                                    x-show="running">sync</span>
                                <span x-text="running ? 'Analyzing...' : 'Start Clarification'"></span>
                            </button>
                        </div>
                        <div x-show="error" x-text="error"
                            class="rounded-md bg-red-50 border border-red-200 p-2.5 text-[12px] text-red-700 font-mono">
                        </div>
                    </div>
                </section>

                <!-- Active Session Card -->
                <section x-show="session" x-cloak
                    class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between gap-3 flex-wrap">
                        <div class="flex items-center gap-2 min-w-0">
                            <button type="button" @click="copySessionId()"
                                class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-slate-100 hover:bg-slate-200 font-mono text-[11px] transition">
                                <span class="font-medium text-blue-700" x-text="session?.sessionId?.slice(0,8)"></span>
                                <span class="material-symbols-outlined text-[14px] text-slate-500"
                                    x-text="copied ? 'check' : 'content_copy'"></span>
                            </button>
                            <span
                                class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold tracking-wide border"
                                :class="stageBadgeClass(session?.stage)" x-text="session?.stage"></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span
                                class="inline-flex items-center px-2 py-0.5 rounded-full font-mono text-[11px] bg-slate-100 text-slate-600">
                                Turn <span x-text="session?.turnCount || 0"></span> / <span
                                    x-text="session?.maxTurns || 3"></span>
                            </span>
                            <button type="button" @click="reset()"
                                class="font-medium text-[13px] text-blue-700 hover:underline px-1">New</button>
                        </div>
                    </div>

                    <div class="p-5 space-y-4" x-show="session && (
                    session.stage === 'AWAITING_ANSWERS' ||
                    session.stage === 'READY_TO_IMPLEMENT' ||
                    session.stage === 'BLOCKED' ||
                    session.stage === 'CAPPED' ||
                    error)">

                        <!-- AWAITING_ANSWERS -->
                        <template x-if="session && session.stage === 'AWAITING_ANSWERS'">
                            <div class="space-y-4">
                                <div class="rounded-lg bg-blue-50 border border-blue-200 p-3">
                                    <p class="text-[11px] font-semibold uppercase tracking-wider text-blue-800 mb-1">
                                        Awaiting your answers</p>
                                    <p class="text-[13px] text-slate-700 leading-relaxed" x-text="session.summary"></p>
                                </div>
                                <div class="space-y-3">
                                    <template x-for="(q, idx) in (session.questions || [])" :key="q.id">
                                        <div class="rounded-lg bg-slate-50 border border-slate-200 p-4 space-y-3">
                                            <div class="flex items-start gap-2">
                                                <span
                                                    class="w-5 h-5 rounded-full bg-blue-600 text-white flex items-center justify-center font-mono text-[10px] font-bold shrink-0 mt-0.5"
                                                    x-text="'Q' + (idx + 1)"></span>
                                                <p class="text-[14px] font-medium text-slate-900 leading-snug"
                                                    x-html="renderInline(q.question)"></p>
                                            </div>
                                            <template x-if="q.options && q.options.length > 0">
                                                <div class="space-y-1.5">
                                                    <template x-for="opt in q.options" :key="opt.label || opt">
                                                        <div @click="answers[q.id] = (opt.label || opt)"
                                                            class="flex items-center justify-between p-2.5 rounded-lg bg-white border cursor-pointer transition"
                                                            :class="answers[q.id] === (opt.label || opt) ? 'border-blue-400 ring-2 ring-blue-100' : 'border-slate-200 hover:bg-slate-50'">
                                                            <div class="flex items-center gap-2 min-w-0">
                                                                <span
                                                                    class="w-3.5 h-3.5 rounded-full flex items-center justify-center shrink-0 transition"
                                                                    :class="answers[q.id] === (opt.label || opt) ? 'bg-blue-600 ring-2 ring-blue-100' : 'bg-slate-200'">
                                                                    <span class="w-1.5 h-1.5 rounded-full bg-white"
                                                                        x-show="answers[q.id] === (opt.label || opt)"></span>
                                                                </span>
                                                                <span class="text-[13px] text-slate-800 truncate"
                                                                    x-html="renderInline(opt.label || opt)"></span>
                                                            </div>
                                                            <span x-show="opt.hint"
                                                                class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium shrink-0"
                                                                :class="idx === 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-600'"
                                                                x-text="opt.hint"></span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                            <input type="text" x-model="answers[q.id]" placeholder="Your answer..."
                                                class="w-full h-8 px-3 rounded-md bg-white border border-slate-200 font-mono text-[12px] text-slate-800 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                                        </div>
                                    </template>
                                </div>
                                <div>
                                    <label
                                        class="block text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-1">Additional
                                        context (optional)</label>
                                    <input type="text" x-model="additionalContext" placeholder="Any other notes..."
                                        class="w-full h-8 px-3 rounded-md bg-white border border-slate-200 font-mono text-[12px] text-slate-800 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
                                </div>
                                <div class="flex justify-end">
                                    <button type="button" @click="submitAnswers()"
                                        :disabled="submitting || !allAnswered || busy()"
                                        class="h-9 px-5 rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[13px] flex items-center gap-2 transition">
                                        <span class="material-symbols-outlined text-[16px]"
                                            x-show="!submitting">send</span>
                                        <span class="material-symbols-outlined text-[16px] animate-spin"
                                            x-show="submitting">autorenew</span>
                                        <span
                                            x-text="submitting ? 'Submitting...' : 'Submit Clarification Answer'"></span>
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- READY_TO_IMPLEMENT with intent branches -->
                        <template x-if="session && session.stage === 'READY_TO_IMPLEMENT'">
                            <div class="space-y-4">
                                <div class="rounded-lg bg-emerald-50 border border-emerald-200 p-4">
                                    <div class="flex items-center gap-2 mb-2 flex-wrap">
                                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                        <p class="text-[11px] font-semibold uppercase tracking-wider text-emerald-800">
                                            Ready to implement</p>
                                        <span
                                            class="inline-flex items-center px-1.5 py-0.5 rounded-full bg-white border border-emerald-200 text-[10px] font-mono text-emerald-700"
                                            x-text="'confidence: ' + (session.confidence || '')"></span>
                                        <span
                                            class="inline-flex items-center px-1.5 py-0.5 rounded-full bg-white border border-slate-200 text-[10px] font-mono text-slate-600"
                                            x-text="'complexity: ' + (session.complexity || '')"></span>
                                    </div>
                                    <p class="text-[13px] text-slate-800 leading-relaxed" x-text="session.summary"></p>
                                </div>

                                <div class="rounded-lg bg-slate-50 border border-slate-200 overflow-hidden">
                                    <button type="button" @click="previewOpen = !previewOpen"
                                        class="w-full px-3 py-2 flex items-center justify-between text-left hover:bg-slate-100 transition">
                                        <div class="flex items-center gap-2">
                                            <span
                                                class="material-symbols-outlined text-slate-500 text-[16px]">security</span>
                                            <span class="text-[13px] font-medium text-slate-800">Risk &amp;
                                                Assumptions</span>
                                        </div>
                                        <span
                                            class="material-symbols-outlined text-slate-500 text-[18px] transition-transform"
                                            :class="previewOpen ? 'rotate-180' : ''">expand_more</span>
                                    </button>
                                    <div x-show="previewOpen"
                                        class="px-3 pb-3 space-y-3 border-t border-slate-200 pt-3">
                                        <template x-if="session.riskNotes && session.riskNotes.length > 0">
                                            <div>
                                                <p
                                                    class="text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                                                    Risk notes</p>
                                                <ul class="space-y-1">
                                                    <template x-for="r in session.riskNotes" :key="r">
                                                        <li class="text-[12px] text-slate-700 flex gap-2">
                                                            <span class="text-amber-600 shrink-0">▸</span>
                                                            <span x-text="r"></span>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>
                                        </template>
                                        <template x-if="session.assumptionsMade && session.assumptionsMade.length > 0">
                                            <div>
                                                <p
                                                    class="text-[10px] font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                                                    Assumptions</p>
                                                <ul class="space-y-1">
                                                    <template x-for="a in session.assumptionsMade" :key="a">
                                                        <li
                                                            class="flex items-center gap-2 p-1.5 rounded bg-white text-[12px] text-slate-700">
                                                            <span
                                                                class="w-4 h-4 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center shrink-0">
                                                                <span
                                                                    class="material-symbols-outlined text-[12px]">check</span>
                                                            </span>
                                                            <span x-text="a"></span>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <!-- PLAN -->
                                <template x-if="intent === 'PLAN' && !plan">
                                    <div class="flex justify-end">
                                        <button type="button" @click="generatePlan()"
                                            :disabled="generatingPlan || busy()"
                                            class="h-9 px-5 rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[13px] flex items-center gap-2 transition"
                                            style="min-width: 220px; justify-content: center;">
                                            <span class="material-symbols-outlined text-[16px]"
                                                x-show="!generatingPlan">architecture</span>
                                            <span class="material-symbols-outlined text-[16px] animate-spin"
                                                x-show="generatingPlan">autorenew</span>
                                            <span
                                                x-text="generatingPlan ? 'Generating plan...' : 'Generate Plan'"></span>
                                        </button>
                                    </div>
                                </template>

                                <!-- FIX -->
                                <template x-if="intent === 'FIX'">
                                    <div class="space-y-3">
                                        <div class="rounded-lg bg-amber-50 border border-amber-200 p-3">
                                            <div class="flex items-center gap-2">
                                                <span
                                                    class="material-symbols-outlined text-amber-700 text-[16px]">bolt</span>
                                                <p
                                                    class="text-[11px] font-semibold uppercase tracking-wider text-amber-800">
                                                    Fast path</p>
                                            </div>
                                            <p class="text-[12px] text-slate-700 mt-1">
                                                This looks like a small fix. The implementer will run directly — no plan
                                                approval needed. Review the diff before applying.
                                            </p>
                                        </div>
                                        <div class="flex justify-end">
                                            <button type="button" @click="runFix()" :disabled="implementing || busy()"
                                                class="h-9 px-5 rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[13px] flex items-center gap-2 transition"
                                                style="min-width: 180px; justify-content: center;">
                                                <span class="material-symbols-outlined text-[16px]"
                                                    :class="implementing ? 'animate-spin' : ''"
                                                    x-text="implementing ? 'autorenew' : 'build'"></span>
                                                <span x-text="implementing ? 'Running fix...' : 'Run Fix'"></span>
                                            </button>
                                        </div>
                                    </div>
                                </template>

                                <!-- EXPLAIN -->
                                <template x-if="intent === 'EXPLAIN'">
                                    <div class="space-y-3">
                                        <div class="rounded-lg bg-blue-50 border border-blue-200 p-3">
                                            <p class="text-[11px] font-semibold uppercase tracking-wider text-blue-800">
                                                Analysis only</p>
                                            <p class="text-[12px] text-slate-700 mt-1">
                                                This is an explanatory query. No code will be changed. The analysis
                                                artifact is generated in full and available for download.
                                            </p>
                                        </div>
                                        <div class="flex justify-end">
                                            <button type="button" @click="generateExplain()"
                                                :disabled="generatingExplain"
                                                class="h-9 px-5 rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[13px] flex items-center gap-2 transition"
                                                style="min-width: 220px; justify-content: center;">
                                                <span class="material-symbols-outlined text-[16px]"
                                                    x-show="!generatingExplain">psychology</span>
                                                <span class="material-symbols-outlined text-[16px] animate-spin"
                                                    x-show="generatingExplain">autorenew</span>
                                                <span
                                                    x-text="generatingExplain ? 'Analyzing...' : 'Generate Explanation'"></span>
                                            </button>
                                        </div>
                                        <template x-if="explainArtifact">
                                            <div class="rounded-xl border border-slate-200 bg-white overflow-hidden">
                                                <div
                                                    class="px-4 py-2.5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                                    <div class="flex items-center gap-2">
                                                        <span
                                                            class="material-symbols-outlined text-[16px] text-blue-600">psychology</span>
                                                        <span
                                                            class="text-[13px] font-semibold text-slate-900">Analysis</span>
                                                        <span class="text-[10px] font-mono text-slate-500"
                                                            x-text="explainArtifact.shortId"></span>
                                                    </div>
                                                    <a :href="'/artifact/' + explainArtifact.id + '/download'"
                                                        class="h-6 w-6 rounded flex items-center justify-center text-slate-500 hover:text-blue-700 hover:bg-white transition"
                                                        title="Download as markdown">
                                                        <span
                                                            class="material-symbols-outlined text-[14px]">download</span>
                                                    </a>
                                                </div>
                                                <div class="bg-white px-5 py-4 md-body"
                                                    x-html="renderMarkdown(explainArtifact.content)"></div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- DOCUMENT -->
                                <template x-if="intent === 'DOCUMENT'">
                                    <div class="space-y-3">
                                        <div class="rounded-lg bg-emerald-50 border border-emerald-200 p-3">
                                            <p
                                                class="text-[11px] font-semibold uppercase tracking-wider text-emerald-800">
                                                Documentation only</p>
                                            <p class="text-[12px] text-slate-700 mt-1">
                                                No code will change. The generated doc is available for download.
                                            </p>
                                        </div>
                                        <div class="flex justify-end">
                                            <button type="button" @click="generateDoc()" :disabled="generatingDoc"
                                                class="h-9 px-5 rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[13px] flex items-center gap-2 transition"
                                                style="min-width: 180px; justify-content: center;">
                                                <span class="material-symbols-outlined text-[16px]"
                                                    x-show="!generatingDoc">description</span>
                                                <span class="material-symbols-outlined text-[16px] animate-spin"
                                                    x-show="generatingDoc">autorenew</span>
                                                <span x-text="generatingDoc ? 'Generating...' : 'Generate Docs'"></span>
                                            </button>
                                        </div>
                                        <template x-if="docArtifact">
                                            <div class="rounded-xl border border-slate-200 bg-white overflow-hidden">
                                                <div
                                                    class="px-4 py-2.5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                                    <div class="flex items-center gap-2">
                                                        <span
                                                            class="material-symbols-outlined text-[16px] text-emerald-600">description</span>
                                                        <span
                                                            class="text-[13px] font-semibold text-slate-900">Documentation</span>
                                                        <span class="text-[10px] font-mono text-slate-500"
                                                            x-text="docArtifact.shortId"></span>
                                                    </div>
                                                    <a :href="'/artifact/' + docArtifact.id + '/download'"
                                                        class="h-6 w-6 rounded flex items-center justify-center text-slate-500 hover:text-blue-700 hover:bg-white transition"
                                                        title="Download as markdown">
                                                        <span
                                                            class="material-symbols-outlined text-[14px]">download</span>
                                                    </a>
                                                </div>
                                                <div class="bg-white px-5 py-4 md-body"
                                                    x-html="renderMarkdown(docArtifact.content)"></div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- REVIEW -->
                                <template x-if="intent === 'REVIEW'">
                                    <div class="space-y-3">
                                        <div class="rounded-lg bg-slate-50 border border-slate-200 p-3">
                                            <p
                                                class="text-[11px] font-semibold uppercase tracking-wider text-slate-700">
                                                Code review</p>
                                            <p class="text-[12px] text-slate-600 mt-1">
                                                The reviewer will audit the file(s) named in the story.
                                            </p>
                                        </div>
                                        <div class="flex justify-end">
                                            <button type="button" @click="generateReview()" :disabled="busy()"
                                                class="h-9 px-5 rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[13px] flex items-center gap-2 transition"
                                                style="min-width: 200px; justify-content: center;">
                                                <span class="material-symbols-outlined text-[16px]"
                                                    :class="pendingIs('Review') ? 'animate-spin' : ''"
                                                    x-text="pendingIs('Review') ? 'autorenew' : 'rule'"></span>
                                                <span
                                                    x-text="pendingIs('Review') ? 'Reviewing...' : 'Generate Review'"></span>
                                            </button>
                                        </div>
                                        <template x-if="review">
                                            <div class="rounded-xl border border-slate-200 bg-white overflow-hidden">
                                                <div
                                                    class="px-4 py-2.5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                                                    <div class="flex items-center gap-2">
                                                        <span
                                                            class="material-symbols-outlined text-[16px] text-slate-700">rule</span>
                                                        <span

                <!-- Plan card -->
                <template x-if="plan">
                    <div class="rounded-xl border shadow-sm overflow-hidden" :class="planStatusBadge(plan.status)">
                        <div class="px-4 py-2.5 flex items-center justify-between gap-3 border-b cursor-pointer hover:opacity-90 transition"

                            <div class="flex items-center gap-2 min-w-0">
                                <span class="material-symbols-outlined text-[16px] transition-transform"
                                    :class="planExpanded ? 'rotate-90' : ''">chevron_right</span>
                                <span class="material-symbols-outlined text-[16px]">architecture</span>
                                <span class="text-[13px] font-semibold">Implementation Plan</span>
                                <span class="text-[10px] font-mono text-slate-500" x-text="plan.shortId"></span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span
                                    class="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-white/60 border border-slate-200"
                                    x-text="plan.status"></span>
                                <span class="text-[10px] text-slate-500" x-text="'by ' + plan.createdBy"></span>
                                <a :href="'/artifact/' + plan.id + '/download'" @click.stop

                                    <span class="material-symbols-outlined text-[14px]">download</span>
                                </a>
                            </div>
                        </div>
                        <div x-show="planExpanded" x-collapse>
                            <div class="bg-white px-5 py-4 md-body" x-html="renderMarkdown(plan.content)"></div>
                            <div x-show="artifactError" x-text="artifactError"
                                class="px-4 py-2 bg-red-50 border-t border-red-200 text-[12px] text-red-700 font-mono">
                            </div>

                            <template x-if="plan.status === 'DRAFT'">
                                <div
                                    class="px-4 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-3">
                                    <p class="text-[11px] text-slate-500 italic">Review the plan before implementing.
                                        Approving unlocks the implementer.</p>
                                    <div class="flex items-center gap-2">
                                        <button type="button" @click="rejectPlan()" :disabled="busy()"
                                            class="h-8 px-3 rounded-md bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[12px] transition">Reject</button>
                                        <button type="button" @click="approvePlan()" :disabled="busy()"
                                            class="h-8 px-4 rounded-md bg-emerald-600 text-white hover:bg-emerald-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[12px] flex items-center gap-1.5 shadow-sm transition">
                                            <span class="material-symbols-outlined text-[14px]">check</span>
                                            Approve
                                        </button>
                                    </div>
                                </div>
                            </template>

                            <template x-if="plan.status === 'APPROVED'">
                                <div
                                    class="px-4 py-3 bg-emerald-50 border-t border-emerald-200 flex items-center justify-between gap-3">
                                    <p class="text-[11px] text-emerald-800">Plan approved. Ready to run the implementer.
                                    </p>
                                    <button type="button" @click="runImplementer()" :disabled="busy()"
                                        class="h-8 px-4 rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[12px] flex items-center gap-1.5 shadow-sm transition"
                                        style="min-width: 180px; justify-content: center;">
                                        <span class="material-symbols-outlined text-[14px]"
                                            :class="pendingIs('Implement') ? 'animate-spin' : ''"
                                            x-text="pendingIs('Implement') ? 'autorenew' : 'build'"></span>
                                        <span
                                            x-text="pendingIs('Implement') ? 'Implementing...' : 'Run Implementer'"></span>
                                    </button>
                                </div>
                            </template>

                            <template x-if="plan.status === 'REJECTED'">
                                <div
                                    class="px-4 py-3 bg-red-50 border-t border-red-200 flex items-center justify-between gap-3">
                                    <p class="text-[11px] text-red-800">Plan rejected. Generate a new one to try again.

                                    <button type="button" @click="generatePlan()" :disabled="busy()"
                                        class="h-8 px-4 rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 font-medium text-[12px] flex items-center gap-1.5 shadow-sm transition">
                                        <span class="material-symbols-outlined text-[14px]"

                                        <span class="material-symbols-outlined text-[14px] animate-spin"

                                    </button>

                <!-- Review card -->

                        <template x-if="review">

                        </template>
                        <template x-if="!review">
                            <div class="px-5 py-4 text-[13px] text-slate-600">

                                <span class="font-medium text-slate-800">dwight</span> audit it before you apply.
                            </div>
                        </template>
                        <div x-show="artifactError" x-text="artifactError"

                        </div>
                        <div class="px-4 py-3 border-t bg-slate-50 flex items-center justify-between gap-3">

                                <span x-show="review && review?.verdict && review?.verdict !== 'APPROVE'">Review found

                            <div class="flex items-center gap-2">

                                    <span class="material-symbols-outlined text-[14px]"
                                        :class="pendingIs('Review') ? 'animate-spin' : ''"

                                    <span x-text="pendingIs('Review') ? 'Reviewing...' : 'Generate Review'"></span>

                                <button x-show="review && review?.verdict && review?.verdict !== 'APPROVE'"

                                    <span class="material-symbols-outlined text-[14px]"

                        <template x-if="testResult && testResult.failures && testResult.failures.length > 0">
                            <div class="bg-white px-4 py-3 space-y-2 max-h-64 overflow-y-auto">

                                                x-text="f.className + '.' + f.testName"></span>
                                            <span
                                                class="text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded-full bg-white text-red-700"
                                                x-text="f.kind"></span>

                                        <p class="text-slate-700" x-text="f.message"></p>

                                </template>

                        </template>

                        <template x-if="testResult && testResult.status === 'COMPILE_FAILED'">

                                <p class="text-[12px] text-slate-600 mb-2">Compilation output (tail):</p>
                                <pre class="bg-slate-900 text-slate-100 rounded-md p-3 text-[11px] font-mono overflow-x-auto max-h-48 whitespace-pre-wrap"
                                    x-text="testResult.stdoutTail"></pre>
                            </div>

                        <template x-if="testResult && testResult.status === 'TESTS_PASSED'">

                                <div class="flex items-center gap-2">

                                        class="material-symbols-outlined text-emerald-600 text-[18px]">check_circle</span>

                                </div>

                        <template x-if="reimplementing">

                                <span
                                    class="material-symbols-outlined text-[16px] text-blue-600 animate-spin">autorenew</span>
                                <span class="text-[13px] font-medium text-blue-800">

                                </span>
                            </div>
                        </template>
                        <div
                            class="px-4 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-3 flex-wrap">
                            <p class="text-[11px] text-slate-500 italic">
                                <span x-show="!testResult">Run the tests to verify this diff compiles and passes.</span>
                                <span x-show="testResult && testResult.status === 'TESTS_PASSED'">On disk. Undo to
                                    revert.</span>
                                <span x-show="testResult && testResult.status !== 'TESTS_PASSED'">Tests failed. Fix with
                                    feedback or undo.</span>
                            </p>
                            <div class="flex items-center gap-2">
                                <button x-show="testResult && testResult.status === 'TESTS_PASSED'" type="button"
                                    @click="undoApply()" :disabled="busy()"
                                    class="h-8 px-4 rounded-md bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[12px] flex items-center gap-1.5 transition">
                                    <span class="material-symbols-outlined text-[14px]">undo</span>
                                    Undo
                                </button>
                                <button type="button" @click="runTests()" :disabled="runningTests || busy()"
                                    class="h-8 px-4 rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[12px] flex items-center gap-1.5 shadow-sm transition">
                                    <span class="material-symbols-outlined text-[14px]"
                                        :class="runningTests ? 'animate-spin' : ''"
                                        x-text="runningTests ? 'autorenew' : 'science'"></span>
                                    <span
                                        x-text="runningTests ? 'Running...' : (testResult ? 'Re-run Tests' : 'Run Tests')"></span>
                                </button>
                                <button x-show="testResult && testResult.status !== 'TESTS_PASSED'" type="button"
                                    @click="reimplement()" :disabled="busy()"
                                    class="h-8 px-4 rounded-md bg-amber-600 text-white hover:bg-amber-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed font-medium text-[12px] flex items-center gap-1.5 shadow-sm transition">
                                    <span class="material-symbols-outlined text-[14px]"
                                        :class="pendingIs('Implement') ? 'animate-spin' : ''"
                                        x-text="pendingIs('Implement') ? 'autorenew' : 'refresh'"></span>
                                    <span
                                        x-text="pendingIs('Implement') ? 'Re-implementing...' : 'Re-implement with Feedback'"></span>

                        </div>
                    </div>
                </template>
            </div>
